name: eval_probe
output_dir: data/runs/evaluation
wandb_logging: true

task:
  name: null
  overwrite_data: false

# Optional sample-level transforms applied after task datasets are built and
# before batches are passed to the model. Omit or set to null to pass samples
# through unchanged.
transforms: null

# Example:
# transforms:
#   name: pad_center_crop
#   key: image
#   size: [208, 240, 208]
#   pad_value: 0.0

model:
  name: smri_mae
  checkpoint_path: null

  # Optional mask handling for smri_mae.
  # use_input_mask: true expects each evaluation batch to include "mask".
  use_input_mask: false

  # Optional runtime mask generation. Supported values: null, mean.
  # mean computes mask = x > x.mean() per volume.
  calculate_mask: null

  img_size: [208, 240, 208]
  patch_size: 8
  in_chans: 1
  model_kwargs:
    class_token: true
    reg_tokens: 0

mode:
  name: probe

representation: cls

head:
  name: linear
  pooling: first

optimization:
  epochs: 50
  batch_size: 8
  lr: 1e-3
  weight_decay: 0.0
  num_workers: 0

evaluation:
  selection_metric: mae
  selection_mode: min

device: cuda
seed: 7338
